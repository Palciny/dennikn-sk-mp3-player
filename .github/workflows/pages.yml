name: Deploy site to GitHub Pages

# Replaces GitHub's built-in "pages build and deployment" (deploy from branch),
# which still runs on Node 20 actions. Requires Settings -> Pages -> Source:
# "GitHub Actions".
#
# Commits pushed by the index workflow use GITHUB_TOKEN and therefore do not
# fire a push trigger, so we also deploy whenever that workflow finishes.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_run:
    workflows: ['Update Denník N audio index']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
